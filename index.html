<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Interactive Avatar Pro | Phone Scroll</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        :root {
            --bg-grad-1: #1a0b1c;
            --bg-grad-2: #3b102a;
            --bg-grad-3: #1a0b1c;
            
            --glass-bg: rgba(255, 228, 230, 0.04);
            --glass-border: rgba(255, 182, 193, 0.2);
            --glass-shadow: rgba(0, 0, 0, 0.5);
            
            --text-main: #fff0f5;
            --text-muted: #fbcfe8;
            --btn-text: #fff;
            
            --header-g1: #ffe4e6;
            --header-g2: #fbcfe8;
            
            --bar-bg: rgba(0, 0, 0, 0.4);

            --looks-color: #d946ef;
            --gym-color: #3b82f6;
            --love-color: #fb7185;
            --shyness-color: #2dd4bf;
        }

        body.shosho-mode {
            --bg-grad-1: #ffffff;
            --bg-grad-2: #fff0f5;
            --bg-grad-3: #ffe4e6;
            
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(244, 114, 182, 0.5);
            --glass-shadow: rgba(255, 182, 193, 0.3);
            
            --text-main: #831843;
            --text-muted: #be185d;
            --btn-text: #831843;
            
            --header-g1: #be185d;
            --header-g2: #831843;
            
            --bar-bg: rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100dvh; 
            padding: env(safe-area-inset-top, 20px) 16px env(safe-area-inset-bottom, 20px);
            transition: color 0.5s ease;
            overflow-y: auto; /* مخصص للسكرول في التليفون */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .app-container {
            position: relative;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 24px 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 30px 60px var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: auto;
        }

        .header {
            text-align: center;
            width: 100%;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(to right, var(--header-g1), var(--header-g2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.5s ease;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            border-radius: 24px;
            padding: 4px;
            background: linear-gradient(135deg, var(--glass-border), transparent);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            transition: box-shadow 0.2s ease, background 0.2s ease;
            flex-shrink: 0;
        }

        .image-display {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            background-color: #000;
        }

        .image-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            /* ترانزيشن سريع جداً وغير ملحوظ */
            transition: opacity 0.12s ease-out;
        }

        .ui-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .stats-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.5s ease;
        }

        .bar-bg-container {
            width: 100%;
            height: 10px;
            background: var(--bar-bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
            transition: background 0.5s ease;
        }

        .bar-fill {
            height: 100%;
            width: 50%;
            border-radius: 10px;
            transition: width 0.4s ease-out, background-color 0.2s;
        }

        #fill-looks { background: linear-gradient(90deg, #a21caf, var(--looks-color)); }
        #fill-gym { background: linear-gradient(90deg, #1d4ed8, var(--gym-color)); }
        #fill-love { background: linear-gradient(90deg, #be123c, var(--love-color)); }
        #fill-shyness { background: linear-gradient(90deg, #0f766e, var(--shyness-color)); }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            position: relative;
            padding: 13px 10px;
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--btn-text);
            background: rgba(255, 255, 255, 0.05);
            transition: transform 0.1s ease, background 0.2s ease;
        }
        
        button:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.15); }

        .btn-flirt { border-bottom: 3px solid var(--love-color); }
        .btn-tease { border-bottom: 3px solid #facc15; }
        .btn-gym { border-bottom: 3px solid var(--gym-color); }
        .btn-sad { border-bottom: 3px solid var(--shyness-color); }
        
        .btn-game { 
            grid-column: span 2; 
            border: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff !important;
            font-weight: 700;
        }

        .btn-shosho {
            grid-column: span 2;
            border: none;
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            color: #fff !important;
            font-weight: 700;
        }
        
        .btn-chill { 
            grid-column: span 2; 
            border-bottom: 3px solid #cbd5e1; 
            background: rgba(150,150,150,0.1); 
        }

        #game-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 11, 28, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 32px;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 30px 16px;
            overflow: hidden;
            text-align: center;
            color: #fff;
        }

        body.shosho-mode #game-overlay {
            background: rgba(255, 255, 255, 0.9);
            color: #831843;
        }

        #game-overlay h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            z-index: 101;
        }

        #game-score {
            font-size: 1.05rem;
            font-weight: 600;
            z-index: 101;
            margin-bottom: 16px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
        }

        .falling-item {
            position: absolute;
            top: -50px;
            font-size: 2.2rem;
            cursor: pointer;
            user-select: none;
            animation: fall linear forwards;
            z-index: 100;
        }

        @keyframes fall {
            to { top: 110%; }
        }

        /* PC адапت خفيف لو اتفتح على جهاز */
        @media (min-width: 900px) {
            .app-container {
                max-width: 440px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="game-overlay">
            <h2>Catch Hearts for Mimi 🐾</h2>
            <div id="game-score">Score: 0 | Time: 10s</div>
        </div>

        <div class="header">
            <h1>Dynamic Avatar</h1>
        </div>

        <div class="image-wrapper" id="img-wrapper">
            <div class="image-display">
                <img id="avatar" src="WhatsApp Image 2026-09-13 at 2.55.30 PM.jpeg" alt="Avatar">
            </div>
        </div>

        <div class="ui-panel">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-info"><span>Looksmaxing 🗿</span> <span id="val-looks">50%</span></div>
                    <div class="bar-bg-container"><div class="bar-fill" id="fill-looks"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-info"><span>Gym 🏋️‍♂️</span> <span id="val-gym">50%</span></div>
                    <div class="bar-bg-container"><div class="bar-fill" id="fill-gym"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-info"><span>Love ❤️</span> <span id="val-love">50%</span></div>
                    <div class="bar-bg-container"><div class="bar-fill" id="fill-love"></div></div>
                </div>
                <div class="stat-item">
                    <div class="stat-info"><span>Shyness 🥺</span> <span id="val-shyness">50%</span></div>
                    <div class="bar-bg-container"><div class="bar-fill" id="fill-shyness"></div></div>
                </div>
            </div>

            <div class="action-grid">
                <button class="btn-flirt" onclick="triggerAction('flirt')">Flirt 🥰</button>
                <button class="btn-tease" onclick="triggerAction('tease')">Tease 👀</button>
                <button class="btn-gym" onclick="triggerAction('gym')">Hit the Gym 💪</button>
                <button class="btn-sad" onclick="triggerAction('sad')">Make Sad 🥺</button>
                
                <button class="btn-game" onclick="startMiniGame()">Play Mini-Game 🎮</button>
                <button class="btn-shosho" onclick="triggerAction('shosho')">Show him Shosho ✨</button>
                <button class="btn-chill" onclick="triggerAction('chill')">Reset / Chill 🧊</button>
            </div>
        </div>
    </div>

    <script>
        const photos = {
            default: "WhatsApp Image 2026-09-13 at 2.55.30 PM.jpeg",
            chill: "WhatsApp Image 2026-09-13 at 2.55.29 PM (1).jpeg",
            eyeTease: "WhatsApp Image 2026-09-13 at 2.55.29 PM.jpeg", 
            blush: "WhatsApp Image 2026-09-13 at 2.55.28 PM.jpeg",
            gym1: "WhatsApp Image 2026-09-13 at 2.56.16 PM.jpeg",
            gym2: "WhatsApp Image 2026-09-13 at 2.56.15 PM (1).jpeg",
            gym3: "WhatsApp Image 2026-09-13 at 2.56.15 PM.jpeg",
            sad: "WhatsApp Image 2026-09-13 at 2.55.30 PM (1).jpeg",
            dog: "WhatsApp Image 2026-09-13 at 2.55.30 PM (2).jpeg",
            fire: "WhatsApp Image 2026-09-13 at 2.55.28 PM (1).jpeg"
        };

        const gymCycle = [photos.gym1, photos.gym2, photos.gym3];
        const chillCycle = [photos.default, photos.chill];
        
        let gymIndex = 0;
        let chillIndex = 0;
        let stats = { looks: 50, gym: 50, love: 50, shyness: 50 };

        function updateUI() {
            for (let key in stats) {
                stats[key] = Math.max(0, Math.min(100, stats[key]));
                document.getElementById(`fill-${key}`).style.width = stats[key] + '%';
                document.getElementById(`val-${key}`).innerText = stats[key] + '%';
            }
        }

        function setAvatar(imgSrc, wrapperGlow) {
            const avatar = document.getElementById('avatar');
            const wrapper = document.getElementById('img-wrapper');
            
            // تريانزيشن سريع وغير ملحوظ (0.12 ثانية بدون scale أبطأ)
            avatar.style.opacity = 0.3;
            
            setTimeout(() => {
                avatar.src = imgSrc;
                avatar.style.opacity = 1;
                
                wrapper.style.background = `linear-gradient(135deg, ${wrapperGlow}, transparent)`;
                wrapper.style.boxShadow = `0 15px 30px rgba(0,0,0,0.3), 0 0 15px ${wrapperGlow}40`;
            }, 120); 
        }

        function triggerAction(action) {
            if (action !== 'shosho') {
                document.body.classList.remove('shosho-mode');
            }

            switch(action) {
                case 'shosho':
                    stats = { looks: 100, gym: 100, love: 100, shyness: 100 };
                    document.body.classList.add('shosho-mode');
                    setAvatar(photos.blush, '#ec4899');
                    break;
                case 'flirt':
                    stats.love += 30; stats.shyness += 15; stats.looks += 5;
                    setAvatar(photos.blush, 'var(--love-color)');
                    break;
                case 'tease':
                    stats.love += 15; stats.shyness += 30; stats.gym -= 10;
                    setAvatar(photos.eyeTease, '#facc15');
                    break;
                case 'gym':
                    stats.gym += 25; stats.looks += 15; stats.shyness -= 10;
                    setAvatar(gymCycle[gymIndex], 'var(--gym-color)');
                    gymIndex = (gymIndex + 1) % gymCycle.length;
                    break;
                case 'sad':
                    stats.shyness += 40; stats.love -= 15; stats.looks -= 10;
                    setAvatar(photos.sad, 'var(--shyness-color)');
                    break;
                case 'chill':
                    for (let key in stats) {
                        stats[key] += (50 - stats[key]) * 0.5; 
                        stats[key] = Math.round(stats[key]);
                    }
                    setAvatar(chillCycle[chillIndex], 'var(--glass-border)');
                    chillIndex = (chillIndex + 1) % chillCycle.length;
                    break;
            }
            updateUI();
        }

        let gameActive = false;
        let score = 0;
        let timeLeft = 10;
        let spawnInterval;
        let timerInterval;

        function startMiniGame() {
            if (gameActive) return;
            
            const overlay = document.getElementById('game-overlay');
            overlay.style.display = 'flex';
            
            score = 0;
            timeLeft = 10;
            gameActive = true;
            updateGameScoreText();

            spawnInterval = setInterval(spawnItem, 600);
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateGameScoreText();
                if (timeLeft <= 0) {
                    endMiniGame();
                }
            }, 1000);
        }

        function spawnItem() {
            if (!gameActive) return;
            
            const item = document.createElement('div');
            const icons = ['❤️', '💖', '✨', '🐾'];
            item.innerText = icons[Math.floor(Math.random() * icons.length)];
            item.className = 'falling-item';
            
            item.style.left = (Math.random() * 80 + 10) + '%';
            const duration = Math.random() * 1.5 + 2;
            item.style.animationDuration = duration + 's';
            
            document.getElementById('game-overlay').appendChild(item);
            
            item.ontouchstart = item.onmousedown = (e) => {
                e.preventDefault();
                if (!gameActive) return;
                
                score++;
                updateGameScoreText();
                stats.love += 5;
                stats.looks += 1;
                updateUI();
                item.remove();
            };

            setTimeout(() => {
                if (item.parentElement) item.remove();
            }, duration * 1000);
        }

        function endMiniGame() {
            gameActive = false;
            clearInterval(spawnInterval);
            clearInterval(timerInterval);
            
            const overlay = document.getElementById('game-overlay');
            document.querySelectorAll('.falling-item').forEach(el => el.remove());
            
            overlay.innerHTML = `
                <h2>Time's Up! 🐾</h2>
                <div id="game-score">Final Score: ${score}</div>
                <p style="margin-top: 10px; font-weight: 600;">Stats Boosted!</p>
            `;
            
            setTimeout(() => {
                overlay.style.display = 'none';
                overlay.innerHTML = `
                    <h2>Catch Hearts for Mimi 🐾</h2>
                    <div id="game-score">Score: 0 | Time: 10s</div>
                `;
            }, 2000);
        }

        function updateGameScoreText() {
            document.getElementById('game-score').innerText = `Score: ${score} | Time: ${timeLeft}s`;
        }

        window.onload = () => {
            updateUI();
            setAvatar(photos.default, 'var(--glass-border)');
        };
    </script>
</body>
</html>
